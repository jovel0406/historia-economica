# Despliegue en GitHub Pages (docs/DECISIONES.md, D13). Versiones de acciones verificadas el 2026-09-14.
# `pnpm run build` ejecuta primero la validación estricta del contenido: si falla, no hay despliegue.
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: "24"
          package-manager: pnpm@12.4.1
          build-cmd: pnpm run build
        env:
          # Fijar en la configuración del repositorio (Settings → Variables): URL pública del sitio.
          ASTRO_SITE: ${{ vars.ASTRO_SITE }}

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
